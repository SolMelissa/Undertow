<div class="hud-panel">
  <div class="hud-titlebar">THROUGHPUT :: queued vs due<div class="rule"></div></div>
  <div class="p-2">
    {% if not graph %}
    <div class="text-[11px] text-[#5a8a6c] h-20 flex items-center">gathering telemetry&hellip;</div>
    {% else %}
    <svg viewBox="0 0 {{ graph.width }} {{ graph.height }}" class="w-full h-24" preserveAspectRatio="none">
      <line x1="0" y1="{{ graph.height // 2 }}" x2="{{ graph.width }}" y2="{{ graph.height // 2 }}" stroke="#0d2416" stroke-width="1" />
      <polyline points="{{ graph.queued_points }}" fill="none" stroke="#39d3ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      <polyline points="{{ graph.due_points }}" fill="none" stroke="#ff9d3c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="{{ graph.queued_last[0] }}" cy="{{ graph.queued_last[1] }}" r="4" fill="#020604" />
      <circle cx="{{ graph.queued_last[0] }}" cy="{{ graph.queued_last[1] }}" r="2.5" fill="#39d3ff" />
      <circle cx="{{ graph.due_last[0] }}" cy="{{ graph.due_last[1] }}" r="4" fill="#020604" />
      <circle cx="{{ graph.due_last[0] }}" cy="{{ graph.due_last[1] }}" r="2.5" fill="#ff9d3c" />
    </svg>
    <div class="flex justify-between text-[11px] mt-1">
      <span class="flex items-center gap-1 text-[#5a8a6c]"><span class="inline-block w-2 h-2" style="background:#39d3ff"></span>queued <span class="text-[#39d3ff]">{{ graph.queued_now }}</span></span>
      <span class="flex items-center gap-1 text-[#5a8a6c]"><span class="inline-block w-2 h-2" style="background:#ff9d3c"></span>due <span class="text-[#ff9d3c]">{{ graph.due_now }}</span></span>
      <span class="text-[#5a8a6c]">max <span class="text-[#39ff88]">{{ graph.peak }}</span></span>
    </div>
    {% endif %}
  </div>
</div>
