{% if not conns %}
<div class="kawaii-empty" style="padding:1rem;">no active connections right now</div>
{% endif %}
{% for c in conns %}
<div style="display:flex; align-items:center; gap:0.6rem; font-size:0.82rem; padding:0.3rem 0;">
  <span style="width:7rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--k-text);" title="{{ c.name }} ({{ c.pid }})">{{ c.name }}</span>
  <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--k-text-dim-text);">{{ c.laddr }} <span style="color:var(--k-accent-2-text);">&rarr;</span> {{ c.raddr }}</span>
  <span style="color:var(--k-good);">{{ c.status }}</span>
</div>
{% endfor %}
