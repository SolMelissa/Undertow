<div class="hud-panel">
  <div class="hud-titlebar">TOP_PROCS :: cpu-normalized<div class="rule"></div></div>
  <div class="p-2 text-[11px] flex flex-col gap-0.5">
    {% for p in procs %}
    <div class="flex justify-between gap-2">
      <span class="flex-1 truncate text-[#8fffb8]">{{ p.name }}</span>
      <span class="w-10 text-right tabular-nums text-[#39ff88]">{{ p.cpu }}%</span>
      <span class="w-14 text-right tabular-nums text-[#5a8a6c]">{{ p.mem_mb|round(0)|int }}M</span>
    </div>
    {% endfor %}
  </div>
</div>
