<div class="hud-panel">
  <div class="hud-titlebar">SECTOR_SCAN<div class="rule"></div></div>
  <div class="flex flex-col gap-1 p-2">
    {% if not sector %}
    <div class="text-[11px] text-[#5a8a6c]">no contacts on scope</div>
    {% endif %}
    {% for row in sector %}
    <div class="flex items-center gap-2 text-[11px]">
      <span class="w-16 truncate text-[#5a8a6c]" title="{{ row.name }}">{{ row.name }}</span>
      <div class="flex-1 h-3 bg-[#020604] overflow-hidden">
        <div class="h-3 bg-[#39ff88]" style="width: {{ row.pct }}%"></div>
      </div>
      <span class="w-6 text-right tabular-nums">{{ row.count }}</span>
    </div>
    {% endfor %}
  </div>
</div>
