[project]
name = "undertow"
version = "1.0.0"
description = "Cockpit launcher/dashboard for Hydrus + hydownloader"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "psutil==7.2.2",
    "pywin32==312; sys_platform == 'win32'",
    "rich==15.0.0",
    "flask==3.1.3",
    "wordfreq==3.1.1",
]

[tool.setuptools]
packages = ["undertow"]
