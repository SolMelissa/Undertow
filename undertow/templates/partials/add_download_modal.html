<div class="flex flex-col gap-2">
  <div class="text-lg font-bold text-[#39ff88] glow-title tracking-wide">ONE-OFF DOWNLOAD</div>
  <p class="text-xs text-[#8aa0a8]">Paste a URL to download once. Several, comma-separated, is fine.</p>
  <form hx-post="/downloads/add" hx-target="#modal-content" hx-swap="innerHTML" class="flex flex-col gap-2">
    <input type="text" name="urls" required placeholder="https://example.com/gallery/..."
           class="input input-sm input-bordered bg-[#0b0d10] border-[#39ff8866] text-[#d8f6ff]">
    <div class="flex justify-end gap-2">
      <button type="button" class="btn btn-sm" onclick="document.getElementById('modal').close()">Cancel</button>
      <button type="submit" class="btn btn-sm btn-primary">Queue</button>
    </div>
  </form>
  {% if message %}
  <div class="alert {{ 'alert-error' if message_error else 'alert-success' }} py-2 text-sm">{{ message }}</div>
  {% endif %}
</div>
