<div class="kawaii-card">
  <div class="kawaii-stat-label" style="margin-bottom:0.6rem;">Downloads by Site</div>
  <div style="display:flex; flex-direction:column; gap:0.5rem;">
    {% if not sector %}
    <div class="kawaii-stat-note">no sites tracked yet</div>
    {% endif %}
    {% for row in sector %}
    <div style="display:flex; align-items:center; gap:0.6rem; font-size:0.85rem;">
      <span style="width:5.5rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--k-text);" title="{{ row.name }}">{{ row.name }}</span>
      <div class="kawaii-bar-track" style="flex:1; margin-top:0;">
        <div class="kawaii-bar-fill" style="width: {{ row.pct }}%"></div>
      </div>
      <span style="width:2rem; text-align:right; color:var(--k-text-dim-text);">{{ row.count }}</span>
    </div>
    {% endfor %}
  </div>
</div>
