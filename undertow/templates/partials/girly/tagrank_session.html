<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
  <span class="text-xs" style="color:var(--k-text-dim-text);">Comparing around <strong>{{ started_tag }}</strong></span>
  <div style="display:flex; gap:0.5rem;">
    <button type="button" class="kawaii-btn" hx-post="/tagrank/session/undo" hx-target="#tagrank-root" hx-swap="innerHTML">&#8617; Undo last</button>
    <button type="button" class="kawaii-btn kawaii-btn-danger" hx-post="/tagrank/session/end" hx-target="#tagrank-root" hx-swap="innerHTML">End session</button>
  </div>
</div>

{% if done %}
<div class="kawaii-card" style="text-align:center;">
  <p style="margin-bottom:0.75rem;">Pool exhausted - nothing left to judge for this round.</p>
  <button type="button" class="kawaii-btn kawaii-btn-primary" hx-post="/tagrank/session/end" hx-target="#tagrank-root" hx-swap="innerHTML">Finish &amp; save</button>
</div>

{% elif pair_error %}
<div class="kawaii-card" style="color:var(--k-danger-text);">{{ pair_error }}</div>

{% else %}
<div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
  {% for side, f in [("left", left), ("right", right)] %}
  <button type="button" class="kawaii-card" style="cursor:pointer; padding:0.5rem; border:none; text-align:center;"
          hx-post="/tagrank/session/vote" hx-target="#tagrank-root" hx-swap="innerHTML"
          hx-vals='{"choice": "{{ side }}"}'>
    <img src="/media/file/{{ f.file_id }}" loading="lazy"
         style="width:100%; max-height:60vh; object-fit:contain; border-radius:0.4rem; background:var(--k-card-bg, #0000);">
    <p class="text-xs" style="margin-top:0.4rem; color:var(--k-text-dim-text);">file #{{ f.file_id }} &middot; click to pick this one</p>
  </button>
  {% endfor %}
</div>
{% endif %}
