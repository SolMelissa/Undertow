<div class="kawaii-card">
  <div class="kawaii-stat-label">Subscriptions Total</div>
  <div class="kawaii-stat-value">{{ total }}</div>
  <div class="kawaii-stat-note">running for {{ uptime }}</div>
</div>
<div class="kawaii-card">
  <div class="kawaii-stat-label">Active</div>
  <div class="kawaii-stat-value accent">{{ active }}</div>
  <div class="kawaii-stat-note">currently unpaused</div>
</div>
<div class="kawaii-card">
  <div class="kawaii-stat-label">Paused</div>
  <div class="kawaii-stat-value warn">{{ paused }}</div>
  <div class="kawaii-stat-note">not being checked</div>
</div>
<div class="kawaii-card">
  <div class="kawaii-stat-label">Due Now</div>
  <div class="kawaii-stat-value info">{{ due }}</div>
  <div class="kawaii-stat-note">waiting on a check</div>
</div>
