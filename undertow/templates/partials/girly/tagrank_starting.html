{% if not polling %}
<div id="girly-toast-stack" hx-swap-oob="beforeend">
  <div class="toast-item alert alert-success py-2 text-sm rounded-none font-mono shadow-lg flex items-start gap-2"
       x-data x-init="setTimeout(() => $el.remove(), 4000)">
    <span class="flex-1">Launching TagRank around "{{ tag }}"&hellip;</span>
    <button type="button" class="opacity-70 hover:opacity-100 leading-none" @click="$el.closest('.toast-item').remove()">&times;</button>
  </div>
</div>
{% endif %}
<div class="kawaii-card" style="text-align:center;"
     hx-get="/tagrank/launch/poll?tag={{ tag|urlencode }}&started={{ started }}" hx-target="#tagrank-root" hx-swap="innerHTML"
     hx-trigger="load delay:700ms">
  <span class="loading loading-spinner loading-md"></span>
  <p style="margin-top:0.5rem; color:var(--k-text-dim-text);">
    Building comparison pool around <strong>{{ tag }}</strong>&hellip;
  </p>
  <p class="text-xs" style="margin-top:0.25rem; color:var(--k-text-dim-text);">TagRank's window will open automatically once it's ready.</p>
</div>
{% if console_log %}
<pre class="kawaii-card" style="margin-top:0.75rem; text-align:left; font-size:0.72rem; max-height:220px; overflow-y:auto; white-space:pre-wrap; word-break:break-word;">{{ console_log }}</pre>
{% endif %}
