<div class="kawaii-card" style="text-align:center;"

     hx-trigger="load delay:700ms">

  <p style="margin-top:0.5rem; color:var(--k-text-dim-text);">
    Building comparison pool around <strong>{{ tag }}</strong>&hellip;
  </p>
</div>
