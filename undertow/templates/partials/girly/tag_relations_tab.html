<!-- Tag management suite: Explore (siblings/parents/children + family-tree map, merged into one
     search so there's a single tag input instead of two), Bulk Edit (add/remove a tag across a
     search, or rename/merge one tag into another - both are "same handful of files, batch-edit
     now" operations so they share one panel with an inner toggle), and Namespaces (read-only
     browser over one namespace's tags by file count, for spotting near-duplicates worth
     migrating). Hydrus's Client API has no write endpoint for siblings/parents themselves, so
     none of this can create a *real* Hydrus tag relationship - see each panel's own note. -->
<div x-data="{ tagSub: 'explore', bulkMode: 'edit' }">
  <div class="kawaii-tabs" style="margin-bottom:1rem;">
    <button type="button" class="kawaii-tab-btn" :class="{ active: tagSub === 'explore' }" @click="tagSub = 'explore'">&#128269; Explore</button>
    <button type="button" class="kawaii-tab-btn" :class="{ active: tagSub === 'bulk' }" @click="tagSub = 'bulk'">&#127991;&#65039; Bulk Edit</button>
    <button type="button" class="kawaii-tab-btn" :class="{ active: tagSub === 'namespaces' }" @click="tagSub = 'namespaces'">&#128193; Namespaces</button>
  </div>

  <div x-show="tagSub === 'explore'">
    {% include "partials/girly/tag_explore_panel.html" %}
  </div>

  <div x-show="tagSub === 'bulk'" x-cloak>
    {% include "partials/girly/bulk_edit_panel.html" %}
  </div>

  <div x-show="tagSub === 'namespaces'" x-cloak>
    {% include "partials/girly/tag_namespaces_panel.html" %}
  </div>
</div>
