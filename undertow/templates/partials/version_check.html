{% if not checked %}
<span id="version-pill" class="kawaii-pill {{ 'ok' if version_info.status == 'current' else ('warn' if version_info.status == 'stale' else 'info') }}"
      style="font-size:0.72rem; padding:0.2rem 0.65rem; cursor:pointer;"
      title="{% if version_info.status == 'current' %}Running the latest pushed commit{% elif version_info.status == 'stale' %}Running code that differs from origin/master{% else %}Version freshness couldn't be determined{% endif %} &middot; click to check for updates"
      hx-post="/version/check" hx-target="#version-pill" hx-swap="outerHTML">
  <span class="dot"></span>
  v{{ version_info.version }} &middot; {{ version_info.commit }}{% if version_info.dirty %}+{% endif %}
</span>
{% elif error %}
<span id="version-pill" class="kawaii-pill warn" style="font-size:0.72rem; padding:0.2rem 0.65rem; cursor:pointer;"
      title="{{ error }} &middot; click to retry"
      hx-post="/version/check" hx-target="#version-pill" hx-swap="outerHTML">
  <span class="dot"></span>couldn't check &middot; retry
</span>
{% elif update_available %}
<span id="version-pill" class="kawaii-pill info" style="font-size:0.72rem; padding:0.2rem 0.65rem; cursor:pointer;"
      title="Click to reload and update" onclick="location.reload()">
  <span class="dot"></span>&#11014; update available &middot; reload
</span>
{% else %}
<span id="version-pill" class="kawaii-pill ok" style="font-size:0.72rem; padding:0.2rem 0.65rem;"
      title="Running the latest pushed commit">
  <span class="dot"></span>v{{ version_info.version }} &middot; up to date
</span>
{% endif %}
